# CampusPulse API (github.com/CampusPulse-ro/api). Services: campuspulse-api (prod, :5092) and
# campuspulse-api-stage (stage, :5093), both on 127.0.0.1. TLS added by certbot (cert "campuspulse").
server {
    server_name campuspulse-api.thorsp.net;
    access_log /var/log/nginx/campuspulse.access.log campuspulse;
    location / {
        proxy_pass http://127.0.0.1:5092/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        client_max_body_size 1m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/campuspulse/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/campuspulse/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    server_name campuspulse-api-stage.thorsp.net;
    access_log /var/log/nginx/campuspulse.access.log campuspulse;
    location / {
        proxy_pass http://127.0.0.1:5093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        client_max_body_size 1m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/campuspulse/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/campuspulse/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = campuspulse-api.thorsp.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name campuspulse-api.thorsp.net;
    listen 80;
    return 404; # managed by Certbot


}
server {
    if ($host = campuspulse-api-stage.thorsp.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name campuspulse-api-stage.thorsp.net;
    listen 80;
    return 404; # managed by Certbot


}