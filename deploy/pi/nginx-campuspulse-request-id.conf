# CampusPulse API: nginx assigns every request its own id (clients can't choose or reuse one), passes it
# to the app as X-Request-Id (the app returns it and puts it on every log line), and logs it here so a
# request can be followed from nginx to the app.
log_format campuspulse '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" host=$host rid=$request_id rt=$request_time';
