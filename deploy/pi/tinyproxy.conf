# CampusPulse egress proxy. The API's network guard (nft inet campuspulse_guard) lets the app users
# reach only their Postgres and THIS proxy; the proxy lets them reach only the hosts in the filter file.
# Source: CampusPulse-ro/api deploy/pi/. Loopback only: never 0.0.0.0 (the tailnet bypasses UFW).
User tinyproxy
Group tinyproxy
Listen 127.0.0.1
Port 8899
Timeout 60
MaxClients 20
Allow 127.0.0.1
# HTTPS only: CONNECT to port 443. FilterURLs On makes the filter see CONNECT targets as "host:port" and
# every other request as "http://...", so the allow-list ("^host:443$" entries) refuses plain HTTP too.
ConnectPort 443
Filter "/etc/tinyproxy/campuspulse-allow"
FilterType ere
FilterURLs On
FilterDefaultDeny Yes
DisableViaHeader Yes
# Connect: logs each tunnel as "CONNECT host:443" (no paths, no tokens) and every refusal.
LogLevel Connect
Syslog On
