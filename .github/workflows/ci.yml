name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    # A real Postgres for the tests marked [PostgresFact] (migrations, and later anything that
    # queries): an in-memory provider would not enforce Postgres rules. Each test creates its
    # own database on this server.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAMPUSPULSE_TEST_DB: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet tool restore

      # Formatting and code style per .editorconfig, before Build so a style problem shows up as
      # a format diff rather than a compiler error. Fix locally with `dotnet format`.
      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      # Code warnings fail the build, but NuGet audit warnings (NU19xx) only warn: a newly
      # published advisory against a transitive package would otherwise block every open PR
      # overnight through no fault of the change.
      # The build writes openapi/v1.json, the contract the mobile and web clients generate their
      # types from. Delete the committed copy first, so a build that stops writing it fails below
      # (as a deletion) instead of passing on the stale file.
      - name: Remove the committed contract
        run: rm -f openapi/v1.json

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror -warnnotaserror:NU1901,NU1902,NU1903,NU1904

      # Committed, so a change to the API without regenerating it fails here.
      - name: OpenAPI contract is up to date
        id: contract
        run: |
          if ! git diff --exit-code -- openapi/ || [ -n "$(git status --porcelain -- openapi/)" ]; then
            echo "::error file=openapi/v1.json::openapi/v1.json is stale: run dotnet build and commit openapi/v1.json (or download the openapi-v1 artifact of this run and commit it)"
            exit 1
          fi

      - name: Upload the regenerated contract
        if: ${{ failure() && steps.contract.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: openapi-v1
          path: openapi/v1.json
          if-no-files-found: ignore
          retention-days: 7

      # A model change without its migration fails here, not at the next deploy. In dotnet ef,
      # `-c` is --context, not the configuration.
      - name: Pending model changes
        run: >
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release
          --project src/CampusPulse.Infrastructure --startup-project src/CampusPulse.Api

      - name: Test
        run: dotnet test --no-build -c Release

      # scripts/campus-virtual-courses.py (standard library only), against invented catalogs.
      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests -v

  publish:
    name: publish (framework-dependent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Portable, framework-dependent output: runs wherever the .NET 10 runtime is installed,
      # the Pi included. The deploy workflow will ship this artifact to the Pi, so nothing is
      # ever built there.
      - run: dotnet publish src/CampusPulse.Api -c Release -o publish

      - uses: actions/upload-artifact@v7
        with:
          name: campuspulse-api
          path: publish
          retention-days: 14

      # The migrations bundle the Pi deploy runs before switching releases: one self-contained
      # linux-arm64 executable, so the Pi needs neither the SDK nor dotnet-ef. It reads
      # ConnectionStrings__Postgres from the environment (DesignTimeDbContextFactory), so the
      # deploy runs `./efbundle` with no password in argv. Artifact `campuspulse-efbundle`,
      # file `efbundle`: deploy/pi/campuspulse-deploy depends on both names.
      - run: dotnet tool restore

      - name: Migrations bundle (linux-arm64)
        run: >
          dotnet ef migrations bundle --self-contained -r linux-arm64 -o efbundle-out/efbundle --force
          --project src/CampusPulse.Infrastructure --startup-project src/CampusPulse.Api

      - uses: actions/upload-artifact@v7
        with:
          name: campuspulse-efbundle
          path: efbundle-out/efbundle
          retention-days: 14

  container:
    name: container image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Built by the SDK from the csproj (no Dockerfile) into a tarball, not pushed: this only
      # proves the image still builds for both architectures. Pushing to GHCR comes with a
      # cloud deploy, if one is ever wanted.
      - name: Build the image
        run: >
          dotnet publish src/CampusPulse.Api -c Release -t:PublishContainer
          -p ContainerArchiveOutputPath=${{ runner.temp }}/campuspulse-api.tar.gz
