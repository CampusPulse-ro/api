# Weekly dependency updates. Security fixes are separate: Dependabot security updates are on in
# the repo settings and open their own PRs at once.
#
# Minor and patch updates come grouped into one PR per ecosystem. Majors come one PR each, never
# bundled, and for the packages below they are ignored: they move with the .NET major (net10.0
# today; the .NET 11 train targets net11.0 only; Serilog.Extensions.Logging follows
# Microsoft.Extensions.Logging's major) or break the build (Microsoft.OpenApi 3.x makes
# IOpenApiMediaType.Example read-only and the ASP.NET Core 10 XML-comment generator fails; see
# the pin in CampusPulse.Api.csproj). Minor/patch of those still arrive, e.g. the OpenApi 2.x
# floor that newer Microsoft.AspNetCore.OpenApi releases need.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.NamingConventions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.Extensions.Logging"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
